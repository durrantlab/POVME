[workspace]
authors = ["Jacob Durrant <durrantj@pitt.edu>"]
channels = ["conda-forge"]
description = "Detect and characterize pockets from molecular simulations"
name = "povme"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "2.2.2"
readme = "README.md"

[pypi-dependencies]
povme = { path = ".", editable = true }
pymolecule = { git = "https://github.com/durrantlab/pymolecule.git", rev = "614a95a0b792f83fbee77e4c7eed7d5ce046dee1" }
ray = { version = ">=2.37.0,<3"}

[system-requirements]
linux = "3.10.0"
libc = { family="glibc", version="2.17" }

[tasks]

[environments]
dev = ["dev"]
docs = ["docs"]

[dependencies]
python = ">=3.10,<3.13"
scipy = ">=1.14.1,<2"
numpy = ">=2.1.3,<3"
pydantic = ">=2.10.2,<3"
pyyaml = ">=6.0.2,<7"
loguru = ">=0.7.2,<0.8"

[feature.dev.dependencies]
ruff = ">=0.7.2,<0.8"
black = ">=24.10.0,<25"
isort = ">=5.13.2,<6"
mypy = ">=1.13.0,<2"
twine = ">=5.1.1,<6"
bump-my-version = ">=0.28.1,<0.29"
pytest = ">=8.3.3,<9"
pytest-cov = ">=6.0.0,<7"
coverage = ">=7.6.4,<8"
pip = ">=24.3.1,<25"
setuptools = ">=75.3.0,<76"
types-pyyaml = ">=6.0.12.20240917,<7"
scalene = ">=1.5.41,<2"

[feature.dev.tasks]
format = { cmd = ["ruff", "check", "--select", "I", "--fix", "&&", "ruff", "format", "--config", ".ruff.toml", "./"] }
tests = { cmd = [
    "PYTHONPATH=.",
    "pytest",
    "-c",
    ".pytest.ini",
    "--cov='povme'",
    "--cov-report=xml",
    "--junit-xml=report.xml",
    "--failed-first",
]}
profile = { cmd = [
    "PYTHONPATH=.",
    "scalene",
    "-m",
    "pytest",
    "-c",
    ".pytest.ini",
    "--cov='povme'",
    "--cov-report=xml",
    "--junit-xml=report.xml",
    "--failed-first",
]}
coverage = { cmd = ["coverage", "report"] }
cleanup-build = { cmd = ["rm", "-rf", "./build"] }
build = { cmd = ["python3", "-m", "build"], depends-on = ["cleanup-build"]}
publish-test = { cmd = ["twine", "upload", "--repository", "testpypi", "dist/*"] }
publish = { cmd = ["twine", "upload", "dist/*"] }

[feature.dev.pypi-dependencies]
build = ">=1.2.2.post1,<2"

[feature.docs.dependencies]
# Will need to migrate to https://zensical.org/ once it matures.
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.5.44,<10"
pymdown-extensions = ">=10.21.1,<11"
mkdocstrings = ">=1.0.3,<2"
mkdocstrings-python = ">=2.0.2,<3"
mkdocs-macros-plugin = ">=1.5.0,<2"
mkdocs-glightbox = ">=0.5.2,<0.6"
mkdocs-git-revision-date-localized-plugin = ">=1.2.9,<2"
mkdocs-autorefs = ">=1.4.4,<2"
mkdocs-gen-files = ">=0.6.0,<0.7"

[feature.docs.pypi-dependencies]
mkdocs-awesome-pages-plugin = ">=2.9.3,<3"

[feature.docs.tasks]
docs = { cmd = ["rm", "-rf", "./public/", "&&", "mkdocs", "build", "-d", "public/"] }
serve-docs = { cmd = ["mkdocs", "serve"] }
